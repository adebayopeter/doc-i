version: "3.9"

services:

  # ── 1. FastAPI application ─────────────────────────────────────────────
  api:
    build:
      context: ./api
      args:
        PYTHON_VERSION: "3.12"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${API_PORT}:8000"
    env_file: .env
    volumes:
      - ./api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - internal
    restart: unless-stopped

  # ── 2. Celery worker ───────────────────────────────────────────────────
  worker:
    build:
      context: ./api
      args:
        PYTHON_VERSION: "3.12"
    command: celery -A workers.tasks worker --loglevel=debug --concurrency=2
    env_file: .env
    volumes:
      - ./api:/app
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - internal
    restart: unless-stopped

  # ── 3. Streamlit demo ──────────────────────────────────────────────────
  demo:
    build:
      context: ./demo
      args:
        PYTHON_VERSION: "3.12"
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "${DEMO_PORT}:8501"
    env_file: .env
    volumes:
      - ./demo:/app
    depends_on:
      - api
    networks:
      - internal
    restart: unless-stopped

  # ── 4. PostgreSQL ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    env_file: .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "${DB_EXTERNAL_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    restart: unless-stopped

  # ── 5. Redis ───────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_EXTERNAL_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - internal
    restart: unless-stopped

  # ── 6. MinIO ───────────────────────────────────────────────────────────
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      - MINIO_ROOT_USER=${MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    networks:
      - internal
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  internal:
    driver: bridge
