[tool.pytest.ini_options]
pythonpath = ["."]    # tells pytest: imports resolve from api/
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --cov=. --cov-report=term-missing"

[tool.coverage.run]
data_file = ".coverage"
omit = [
    "tests/*",
    "alembic/*",
    "venv/*",
    # Exclude schemas with no router tests yet — covered when routers are built
    "schemas/analysis.py",
    "schemas/config.py",
    "schemas/document.py",
    # Exclude prod settings — only runs in production environment
    "config/settings/prod.py",
    "services/ocr.py",         # calls Azure DocInt — external API
    "services/extraction.py",  # calls Claude API — external API
    "workers/tasks.py",        # calls Celery + all services — integration test
]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    venv
  | __pycache__
  | alembic/versions
)/
'''

[tool.mypy]
python_version = "3.12"
plugins = ["sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true
mypy_path = "."

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["config", "db", "routers", "services", "schemas", "workers"]
skip = ["venv", "alembic/versions"]

[tool.ruff]
src = ["."]
line-length = 88