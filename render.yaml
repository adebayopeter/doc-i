databases:
  - name: doc-i-postgres
    databaseName: doc_i
    user: doc_i_user
    plan: free
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all

services:
  # ── Redis ────────────────────────────────────────────────────────────
  - type: redis
    name: doc-i-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all

  # ── API ──────────────────────────────────────────────────────────────
  - type: web
    name: doc-i-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: starter
    healthCheckPath: /health
    preDeployCommand: "alembic upgrade head && python scripts/seed_rules.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: doc-i-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: doc-i-redis
          type: redis
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-20250514
      - key: CLAUDE_MAX_TOKENS
        value: "1500"
      - key: AZURE_DOCINT_ENDPOINT
        sync: false
      - key: AZURE_DOCINT_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: REQUIREMENTS_FILE
        value: requirements/prod.txt
      - key: SERVICE_TYPE
        value: api

  # ── Celery Worker ────────────────────────────────────────────────────
  - type: worker
    name: doc-i-worker
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: doc-i-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: doc-i-redis
          type: redis
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-20250514
      - key: CLAUDE_MAX_TOKENS
        value: "1500"
      - key: AZURE_DOCINT_ENDPOINT
        sync: false
      - key: AZURE_DOCINT_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: REQUIREMENTS_FILE
        value: requirements/prod.txt
      - key: SERVICE_TYPE
        value: worker

  # ── Demo ─────────────────────────────────────────────────────────────
  - type: web
    name: doc-i-demo
    runtime: docker
    dockerfilePath: ./demo/Dockerfile
    dockerContext: ./demo
    plan: free
    envVars:
      - key: API_BASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
